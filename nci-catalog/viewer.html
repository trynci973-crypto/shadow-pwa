<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCI Product Catalog – Online Viewer | National Communications Inc.</title>
<meta name="description" content="Browse the full National Communications Inc. (NCI) product catalog online, page by page.">
<style>
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.4 system-ui,sans-serif;background:#525a66;color:#1b2230}
header{position:sticky;top:0;z-index:5;background:#fff;color:#0f172a;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;max-width:1200px;margin:auto}
.logo{color:#0f172a;text-decoration:none;font-weight:800;font-size:18px;margin-right:6px}.logo b{color:#c8102e}.logo span{font-weight:400;opacity:.85;font-size:14px}
.sp{flex:1}a.l{color:#334155;text-decoration:none;font-weight:600;padding:6px 4px}
button,.pg input{font:inherit;min-height:44px;min-width:44px;border:0;border-radius:10px;background:#c8102e;color:#fff;font-weight:700;font-size:18px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}.pg{display:flex;align-items:center;gap:6px}.pg input{width:64px;text-align:center;background:#fff;color:#111;border:1px solid #cbd5e1}
#pages{padding:12px 0 40px}.page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}.page canvas{display:block;width:100%;height:100%}
.page .n{position:absolute;right:6px;bottom:4px;font-size:12px;color:#888}#msg{color:#fff;text-align:center;padding:40px}
@media(max-width:600px){.logo b{color:#c8102e}.logo span{display:none}}
</style></head><body>
<header><div class="bar"><a class="logo" href="index.html"><b>NCI</b><span> National Communications Inc.</span></a>
<a class="l" href="index.html">← Catalog</a><span class="sp"></span>
<div class="pg"><button id="prev" aria-label="Previous page">‹</button><input id="num" type="number" inputmode="numeric" min="1" value="1" aria-label="Page number"><span>/ <b id="count">–</b></span><button id="next" aria-label="Next page">›</button></div>
<button id="zout" aria-label="Zoom out">−</button><button id="fit" aria-label="Fit width" style="font-size:14px;padding:0 10px">Fit</button><button id="zin" aria-label="Zoom in">+</button>
<a class="l" id="dl" href="NCI-National-Communications-Product-Catalog.pdf" download>Download</a></div></header>
<main id="pages"><div id="msg">Loading catalog…</div></main>
<script type="module">
import * as pdfjsLib from "./pdfjs/pdf.min.js?v=20261023v";
pdfjsLib.GlobalWorkerOptions.workerSrc="./pdfjs/pdf.worker.min.js?v=20261023v";
const PDF="NCI-National-Communications-Product-Catalog.pdf";
const $=id=>document.getElementById(id),box=$("pages");
let doc,N=0,cur=1,zoom=1,fitW=true,base=null,els=[],rendered=new Map(),io;
function want(){const q=new URLSearchParams(location.search).get("page"),h=(location.hash.match(/page=(\d+)/)||[])[1];return parseInt(h||q||"1",10)||1}
const clamp=n=>Math.max(1,Math.min(N||1,n));
function scale(){const w=Math.min(box.clientWidth-16,2400);return fitW?w/base.width:zoom}
function layout(){const s=scale();els.forEach((e,i)=>{e.style.width=base.width*s+"px";e.style.height=base.height*s+"px"});rendered.forEach((t,i)=>{t&&t.cancel&&t.cancel()});rendered.clear();els.forEach(e=>{const c=e.querySelector("canvas");c&&c.remove()});io.disconnect();els.forEach(e=>io.observe(e))}
async function render(i){if(rendered.has(i))return;rendered.set(i,null);const e=els[i-1],p=await doc.getPage(i),s=scale(),dpr=Math.min(window.devicePixelRatio||1,2),v=p.getViewport({scale:s*dpr});const c=document.createElement("canvas");c.width=v.width;c.height=v.height;const t=p.render({canvasContext:c.getContext("2d"),viewport:v});rendered.set(i,t);try{await t.promise;e.prepend(c);e.dataset.ok=1}catch(x){}}
function unload(i){const t=rendered.get(i);if(t&&t.cancel)t.cancel();rendered.delete(i);const c=els[i-1].querySelector("canvas");c&&c.remove()}
function go(n,smooth){n=clamp(n);const y=els[n-1].getBoundingClientRect().top+scrollY-document.querySelector("header").offsetHeight-8;window.scrollTo({top:y,behavior:smooth?"smooth":"auto"});setCur(n)}
function setCur(n){cur=n;$("num").value=n;$("prev").disabled=n<=1;$("next").disabled=n>=N;history.replaceState(null,"","?page="+n)}
function track(){const top=document.querySelector("header").offsetHeight+10;let best=cur;for(let i=0;i<N;i++){const r=els[i].getBoundingClientRect();if(r.bottom>top+40){best=i+1;break}}if(best!==cur)setCur(best)}
function setZoom(z){const t=cur;fitW=false;zoom=Math.max(.25,Math.min(5,z));layout();go(t)}
try{
 doc=await pdfjsLib.getDocument({url:PDF,disableAutoFetch:true,disableStream:false}).promise;N=doc.numPages;$("count").textContent=N;$("num").max=N;
 const p1=await doc.getPage(1);base=p1.getViewport({scale:1});$("msg").remove();
 io=new IntersectionObserver(es=>es.forEach(en=>{const i=+en.target.dataset.i;en.isIntersecting?render(i):unload(i)}),{rootMargin:"150% 0px"});
 for(let i=1;i<=N;i++){const e=document.createElement("div");e.className="page";e.id="p"+i;e.dataset.i=i;e.innerHTML=`<span class="n">${i}</span>`;box.append(e);els.push(e)}
 layout();go(want());
}catch(e){$("msg").textContent="Could not load the catalog viewer. ";$("msg").insertAdjacentHTML("beforeend",'<a style="color:#fff" href="'+PDF+'">Open the PDF instead</a>');console.error(e)}
$("prev").onclick=()=>go(cur-1,1);$("next").onclick=()=>go(cur+1,1);
$("num").onchange=()=>go(parseInt($("num").value,10)||1);
$("zin").onclick=()=>setZoom(scale()*1.25);$("zout").onclick=()=>setZoom(scale()/1.25);$("fit").onclick=()=>{const t=cur;fitW=true;layout();go(t)};
let st;addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(track,80)},{passive:true});
let rt,lw=innerWidth;addEventListener("resize",()=>{if(!fitW||innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(()=>{const t=cur;layout();go(t)},200)});
addEventListener("hashchange",()=>go(want()));
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"&&e.altKey){go(cur+1);e.preventDefault()}else if(e.key==="ArrowLeft"){go(cur-1);e.preventDefault()}else if(e.key==="+"||e.key==="="){setZoom(scale()*1.25)}else if(e.key==="-"){setZoom(scale()/1.25)}});
</script>
</body></html>
